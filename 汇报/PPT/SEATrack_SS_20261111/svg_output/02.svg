<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"/><rect x="60" y="50" width="44" height="4" fill="#00766D"/><text x="117" y="59" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">实验设置</text><text x="60" y="128" font-family="PingFang SC" font-size="42" font-weight="700" fill="#172F38">SS 约束两种模态对空间结构的描述</text><text x="65" y="218" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">①  在 RGB 与辅助模态内，分别计算各位置特征之间的余弦相似度。</text><text x="65" y="287" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">②  在模板区、搜索区分别对齐相似度矩阵，两区权重各为 0.5。</text><text x="65" y="356" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">③  训练总损失加入 0.1 × SS 损失；测试用训练后的权重逐帧跟踪。</text><text x="65" y="416" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">模态</text><text x="340" y="416" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">训练集</text><text x="640" y="416" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">轮次</text><text x="880" y="416" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">比较对象</text><rect x="60" y="437" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="476" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">RGB-T</text><text x="340" y="476" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">LasHeR</text><text x="640" y="476" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">60</text><text x="880" y="476" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">第 60 轮基线</text><rect x="60" y="497" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="536" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">RGB-E</text><text x="340" y="536" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">VisEvent</text><text x="640" y="536" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">45</text><text x="880" y="536" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">第 45 轮基线</text><rect x="60" y="557" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="596" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">RGB-D</text><text x="340" y="596" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">DepthTrack</text><text x="640" y="596" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">25</text><text x="880" y="596" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">第 25 轮基线</text><rect x="60" y="655" width="1160" height="1" fill="#BECAC6"/><text x="60" y="691" font-family="PingFang SC" font-size="17" font-weight="400" fill="#526772">SS 作用层索引为 3、5、7、9、11；每个基准使用同一套评测协议。</text><text x="1165" y="691" font-family="PingFang SC" font-size="18" font-weight="700" fill="#00766D">02</text></svg>
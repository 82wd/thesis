<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"/><rect x="60" y="50" width="44" height="4" fill="#00766D"/><text x="117" y="59" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">逐序列分解</text><text x="60" y="128" font-family="PingFang SC" font-size="42" font-weight="700" fill="#172F38">少数大幅退步的序列可以拉低总体均值</text><text x="65" y="200" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">测试集</text><text x="290" y="200" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">衡量方式</text><text x="625" y="200" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">改善 / 下降 / 持平</text><text x="870" y="200" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">均值差</text><rect x="60" y="225" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="264" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">LasHeR</text><text x="290" y="264" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">逐序列 SR</text><text x="625" y="264" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">122 / 122 / 1</text><text x="870" y="264" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">−0.80</text><rect x="60" y="289" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="328" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">RGBT234</text><text x="290" y="328" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">逐序列 MSR</text><text x="625" y="328" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">140 / 91 / 3</text><text x="870" y="328" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">+0.94</text><rect x="60" y="353" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="392" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">VisEvent</text><text x="290" y="392" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">逐序列 SR</text><text x="625" y="392" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">139 / 174 / 7</text><text x="870" y="392" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">−0.63</text><rect x="60" y="417" width="1158" height="1" fill="#CCD7D4"/><text x="65" y="456" font-family="PingFang SC" font-size="22" font-weight="700" fill="#172F38">DepthTrack</text><text x="290" y="456" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">有效标注帧平均 IoU</text><text x="625" y="456" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">22 / 28 / 0</text><text x="870" y="456" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">−2.44</text><text x="64" y="546" font-family="PingFang SC" font-size="26" font-weight="700" fill="#A74D32">VisEvent 跌幅最大的 5 条合计贡献 −0.617 个百分点，总体净降 0.635。</text><text x="64" y="600" font-family="PingFang SC" font-size="20" font-weight="400" fill="#172F38">RGBT234 去掉涨幅和跌幅最大的各 5 条后，其余 224 条的 MSR 仍提高 0.63 个百分点。</text><rect x="60" y="655" width="1160" height="1" fill="#BECAC6"/><text x="60" y="691" font-family="PingFang SC" font-size="17" font-weight="400" fill="#526772">DepthTrack 此处为轨迹诊断；正式 F 分数还使用预测置信度。</text><text x="1165" y="691" font-family="PingFang SC" font-size="18" font-weight="700" fill="#00766D">04</text></svg>
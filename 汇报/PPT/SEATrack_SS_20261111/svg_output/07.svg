<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"/><rect x="60" y="50" width="44" height="4" fill="#00766D"/><text x="117" y="59" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">RGB-D  /  DepthTrack</text><text x="60" y="128" font-family="PingFang SC" font-size="42" font-weight="700" fill="#172F38">一个易拉罐序列贡献了约 47% 的平均 IoU 降幅</text><text x="65" y="236" font-family="PingFang SC" font-size="55" font-weight="700" fill="#A74D32">71.02%  →  13.54%</text><text x="65" y="288" font-family="PingFang SC" font-size="24" font-weight="400" fill="#172F38">colacan03_indoor：基线与 SS 的有效帧平均 IoU</text><text x="65" y="372" font-family="PingFang SC" font-size="39" font-weight="700" fill="#172F38">1,037 / 1,667 帧</text><text x="65" y="421" font-family="PingFang SC" font-size="24" font-weight="400" fill="#172F38">基线 IoU ≥ 0.5，同时 SS IoU &lt; 0.2</text><text x="65" y="503" font-family="PingFang SC" font-size="25" font-weight="400" fill="#172F38">最长连续区间为第 289–742 帧，共 454 帧。</text><text x="65" y="583" font-family="PingFang SC" font-size="22" font-weight="400" fill="#526772">该序列贡献 −1.15 个百分点；50 条序列等权的平均差为 −2.44 个百分点。</text><rect x="60" y="655" width="1160" height="1" fill="#BECAC6"/><text x="60" y="691" font-family="PingFang SC" font-size="17" font-weight="400" fill="#526772">逐帧矩形 IoU，跳过初始化帧与无有效标注的帧。</text><text x="1165" y="691" font-family="PingFang SC" font-size="18" font-weight="700" fill="#00766D">07</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="ending"><rect x="0" y="0" width="1280" height="720" fill="#F7F7F2"/><rect x="60" y="50" width="44" height="4" fill="#00766D"/><text x="117" y="59" font-family="PingFang SC" font-size="19" font-weight="700" fill="#00766D">讨论与下一步</text><text x="60" y="128" font-family="PingFang SC" font-size="42" font-weight="700" fill="#172F38">SS 是否更容易受搜索偏移和相似目标干扰？</text><text x="65" y="223" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">1   从改善、持平和退步序列中分层抽样，保留无相似干扰物的对照。</text><text x="65" y="306" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">2   两版使用相同模板和搜索框，按目标宽高施加 0%、10%、20%、30% 偏移。</text><text x="65" y="389" font-family="PingFang SC" font-size="26" font-weight="400" fill="#172F38">3   记录 IoU 和响应峰位置，比较不同偏移量下的目标切换频率。</text><text x="65" y="500" font-family="PingFang SC" font-size="25" font-weight="700" fill="#00766D">若相同偏移下 SS 更早切换，可进一步对照全区域 SS 与仅目标区域 SS。</text><text x="65" y="573" font-family="PingFang SC" font-size="23" font-weight="400" fill="#526772">用多个随机种子重复训练，估计模型间差异的稳定性。</text><rect x="60" y="655" width="1160" height="1" fill="#BECAC6"/><text x="60" y="691" font-family="PingFang SC" font-size="17" font-weight="400" fill="#526772">组会讨论：优先做受控偏移实验，还是先定位 DepthTrack 最大失败序列的触发帧？</text><text x="1165" y="691" font-family="PingFang SC" font-size="18" font-weight="700" fill="#00766D">09</text></svg>
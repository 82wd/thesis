<?xml version='1.0' encoding='UTF-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans GB"><ns0:rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<ns0:text x="60" y="55" font-size="17" fill="#4A8FBD" font-family="Hiragino Sans GB">想法 1 · 跨模态空间关系校准</ns0:text><ns0:text x="60" y="105" font-size="31" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">SS：约束两种模态的空间结构关系</ns0:text><ns0:text x="70" y="165" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">特征关系</ns0:text><ns0:text x="82" y="203" font-size="19" fill="#303638" font-family="Hiragino Sans GB">RGB 与热红外特征分别按通道归一化：U = normalize(F)</ns0:text><ns0:text x="82" y="234" font-size="19" fill="#303638" font-family="Hiragino Sans GB">计算 token 两两余弦相似度：S = U · Uᵀ</ns0:text><ns0:text x="82" y="265" font-size="19" fill="#303638" font-family="Hiragino Sans GB">以两模态关系矩阵的 MSE 作为辅助损失</ns0:text><ns0:text x="70" y="314" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">区域与层</ns0:text><ns0:text x="82" y="352" font-size="19" fill="#303638" font-family="Hiragino Sans GB">模板 64 tokens → 64×64 关系矩阵；搜索 256 tokens → 256×256</ns0:text><ns0:text x="82" y="383" font-size="19" fill="#303638" font-family="Hiragino Sans GB">模板、搜索分别计算，不构造跨区域位置对</ns0:text><ns0:text x="82" y="414" font-size="19" fill="#303638" font-family="Hiragino Sans GB">在 block 3 / 5 / 7 / 9 / 11 输入处计算并跨层平均</ns0:text><ns0:text x="70" y="463" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">优化目标</ns0:text><ns0:text x="82" y="501" font-size="19" fill="#303638" font-family="Hiragino Sans GB">L = L_tracking + 0.1 × mean_layers(0.5 L_template + 0.5 L_search)</ns0:text><ns0:text x="82" y="532" font-size="19" fill="#303638" font-family="Hiragino Sans GB">SS 不增加参数；梯度回传至 PEFT 参数；推理时跳过辅助损失</ns0:text><ns0:text x="65" y="654" font-size="22" font-weight="bold" fill="#4A8FBD" font-family="Hiragino Sans GB">目标：让模态间关系结构一致，而非强迫特征逐点相同</ns0:text></ns0:svg>
<?xml version='1.0' encoding='UTF-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans GB"><ns0:rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<ns0:text x="60" y="55" font-size="17" fill="#4A8FBD" font-family="Hiragino Sans GB">想法 3 · query/search 区域与层消融</ns0:text><ns0:text x="60" y="105" font-size="31" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">从“约束全部关系”转向“选择约束对象”</ns0:text><ns0:text x="70" y="165" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">区域选择</ns0:text><ns0:text x="82" y="203" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Template-only：只保留模板关系，检查搜索区域约束是否引入干扰</ns0:text><ns0:text x="82" y="234" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Search-only：只对 query/search 关系施加 SS，对应师兄提出的小步验证</ns0:text><ns0:text x="82" y="265" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Target-aware：训练时用 GT 覆盖率区分前景关系与背景关系</ns0:text><ns0:text x="70" y="314" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">定位与强度</ns0:text><ns0:text x="82" y="352" font-size="19" fill="#303638" font-family="Hiragino Sans GB">逐层配置：分别检验 block 3 / 5 / 7 / 9 / 11 的作用位置</ns0:text><ns0:text x="82" y="383" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Half-weight：模板、搜索 SS 系数均减半至 0.025，区分区域与强度因素</ns0:text><ns0:text x="82" y="414" font-size="19" fill="#303638" font-family="Hiragino Sans GB">记录逐层 SS、跟踪 IoU 与训练动态，避免只看单一 loss</ns0:text><ns0:text x="70" y="463" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">总损失示意</ns0:text><ns0:text x="82" y="501" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Template-only：0.05 × L_t；Search-only：0.05 × L_s</ns0:text><ns0:text x="82" y="532" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Half-weight：0.025 × (L_t + L_s)；Target-aware：目标相关加权关系</ns0:text><ns0:text x="65" y="654" font-size="22" font-weight="bold" fill="#4A8FBD" font-family="Hiragino Sans GB">核心原则：逐项改变约束的位置、区域与强度</ns0:text></ns0:svg>
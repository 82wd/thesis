<?xml version='1.0' encoding='UTF-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans GB"><ns0:rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<ns0:text x="60" y="55" font-size="17" fill="#4A8FBD" font-family="Hiragino Sans GB">想法 3 · 已有实验效果</ns0:text><ns0:text x="60" y="105" font-size="31" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">消融只部分缓解退化，尚未找到稳定解法</ns0:text><ns0:text x="70" y="165" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">LasHeR SR（%）</ns0:text><ns0:text x="82" y="203" font-size="19" fill="#303638" font-family="Hiragino Sans GB">基线 57.51 ｜ 初版 SS 56.71</ns0:text><ns0:text x="82" y="234" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Template-only 57.31 ｜ Target-aware 57.29</ns0:text><ns0:text x="82" y="265" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Search-only 56.70 ｜ Half-weight 56.95</ns0:text><ns0:text x="70" y="314" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">RGBT234 MSR（%）</ns0:text><ns0:text x="82" y="352" font-size="19" fill="#303638" font-family="Hiragino Sans GB">基线 63.73 ｜ 初版 SS 64.67</ns0:text><ns0:text x="82" y="383" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Template-only 64.03 ｜ Target-aware 64.06</ns0:text><ns0:text x="82" y="414" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Search-only 63.60 ｜ Half-weight 待最终核验</ns0:text><ns0:text x="70" y="463" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">结论</ns0:text><ns0:text x="82" y="501" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Template-only、Target-aware 与 Half-weight 对 LasHeR 有部分恢复，仍低于基线</ns0:text><ns0:text x="82" y="532" font-size="19" fill="#303638" font-family="Hiragino Sans GB">Search-only 两套全量结果已完成，未恢复成功率；单层配置未完成独立重训评测</ns0:text><ns0:text x="82" y="563" font-size="19" fill="#303638" font-family="Hiragino Sans GB">训练更新预算不完全匹配，不能将差异完全归因于 SS 区域选择</ns0:text><ns0:text x="65" y="654" font-size="22" font-weight="bold" fill="#4A8FBD" font-family="Hiragino Sans GB">结果说明：现有消融界定了问题边界，还未证明有效补救</ns0:text></ns0:svg>
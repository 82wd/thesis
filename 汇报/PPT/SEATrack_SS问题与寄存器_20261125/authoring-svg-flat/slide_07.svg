<?xml version='1.0' encoding='UTF-8'?>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Hiragino Sans GB"><ns0:rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<ns0:text x="60" y="55" font-size="17" fill="#4A8FBD" font-family="Hiragino Sans GB">Register Guidance · 推理特征外推</ns0:text><ns0:text x="60" y="105" font-size="31" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">同一权重做有／无寄存器两次前向</ns0:text><ns0:text x="70" y="165" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">有寄存器分支</ns0:text><ns0:text x="82" y="203" font-size="19" fill="#303638" font-family="Hiragino Sans GB">同一输入 → backbone(registers on) → F_reg</ns0:text><ns0:text x="70" y="252" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">无寄存器分支</ns0:text><ns0:text x="82" y="290" font-size="19" fill="#303638" font-family="Hiragino Sans GB">相同输入与相同权重 → backbone(registers off) → F_no_reg</ns0:text><ns0:text x="70" y="339" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">特征指导</ns0:text><ns0:text x="82" y="377" font-size="19" fill="#303638" font-family="Hiragino Sans GB">F_RG = F_reg + w × (F_reg − F_no_reg)</ns0:text><ns0:text x="82" y="408" font-size="19" fill="#303638" font-family="Hiragino Sans GB">w=0：仅一次骨干前向；w&gt;0：两次骨干前向，再经过一次预测头</ns0:text><ns0:text x="82" y="439" font-size="19" fill="#303638" font-family="Hiragino Sans GB">移除寄存器的特征来自同一训练模型，不是独立训练基线</ns0:text><ns0:text x="70" y="488" font-size="22" font-weight="bold" fill="#202629" font-family="Hiragino Sans GB">训练方式</ns0:text><ns0:text x="82" y="526" font-size="19" fill="#303638" font-family="Hiragino Sans GB">训练始终保留寄存器，只计算跟踪损失；当前起始推理系数 w=1</ns0:text><ns0:text x="65" y="654" font-size="22" font-weight="bold" fill="#4A8FBD" font-family="Hiragino Sans GB">将寄存器带来的特征差异显式加入最终搜索表征</ns0:text></ns0:svg>
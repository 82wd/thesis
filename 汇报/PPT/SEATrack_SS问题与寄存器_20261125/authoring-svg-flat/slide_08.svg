<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" lang="zh-CN"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><text x="60" y="55" font-size="16" fill="#4A8FBD" font-weight="normal">想法 4 · 从损失约束走向架构改动</text><text x="60" y="105" font-size="31" fill="#202629" font-weight="bold">寄存器：为特征交互增加可学习的计算位置</text><rect x="60" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="78" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">空间 patch</text><text x="78" y="260" font-size="18" fill="#202629" font-weight="normal">模板与搜索 token</text><text x="78" y="290" font-size="18" fill="#202629" font-weight="normal">承载局部视觉信息</text><line x1="324" y1="265" x2="353" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="353,265 343,259 343,271" fill="#4A8FBD" /><rect x="360" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="378" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">追加 registers</text><text x="378" y="260" font-size="18" fill="#202629" font-weight="normal">4 个非空间 token</text><text x="378" y="290" font-size="18" fill="#202629" font-weight="normal">可学习初始参数</text><line x1="624" y1="265" x2="653" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="653,265 643,259 643,271" fill="#4A8FBD" /><rect x="660" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="678" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">注意力交互</text><text x="678" y="260" font-size="18" fill="#202629" font-weight="normal">与 patch 共同计算</text><text x="678" y="290" font-size="18" fill="#202629" font-weight="normal">容纳额外信息</text><line x1="924" y1="265" x2="953" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="953,265 943,259 943,271" fill="#4A8FBD" /><rect x="960" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="978" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">保留视觉输出</text><text x="978" y="260" font-size="18" fill="#202629" font-weight="normal">移除 registers</text><text x="978" y="290" font-size="18" fill="#202629" font-weight="normal">搜索特征进入预测头</text><rect x="60" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="78" y="432" font-size="21" fill="#202629" font-weight="bold">动机与预期</text><text x="78" y="470" font-size="18" fill="#202629" font-weight="normal">提供额外的信息交互位置</text><text x="78" y="501" font-size="18" fill="#202629" font-weight="normal">期望 patch 更平滑、结构更清晰</text><text x="78" y="532" font-size="18" fill="#202629" font-weight="normal">高范数与精度收益仍需实测</text><rect x="650" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="668" y="432" font-size="21" fill="#202629" font-weight="bold">与 SS 的关系</text><text x="668" y="470" font-size="18" fill="#202629" font-weight="normal">在无 SS 基线上独立训练</text><text x="668" y="501" font-size="18" fill="#202629" font-weight="normal">损失仍为原跟踪损失</text><text x="668" y="532" font-size="18" fill="#202629" font-weight="normal">不将架构收益与 SS 约束混合</text><rect x="60" y="604" width="1160" height="58" rx="9" fill="#EDF5FA" /><text x="78" y="640" font-size="20" fill="#4A8FBD" font-weight="bold">增加计算槽位 → 改变特征交互 → 再检验跟踪收益</text><text x="60" y="691" font-size="14" fill="#626C70" font-weight="normal">机制示意；实现依据 README_REGISTER_GUIDANCE.md，状态采用注明日期的核验记录。</text></svg>
<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" lang="zh-CN"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><text x="60" y="55" font-size="16" fill="#4A8FBD" font-weight="normal">想法 4 · token 布局与双模态路径</text><text x="60" y="105" font-size="31" fill="#202629" font-weight="bold">插入位置：前 9 层之后，后 3 层共同计算</text><rect x="60" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="78" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">两模态输入</text><text x="78" y="260" font-size="18" fill="#202629" font-weight="normal">每路 64 template</text><text x="78" y="290" font-size="18" fill="#202629" font-weight="normal">+ 256 search</text><line x1="324" y1="265" x2="353" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="353,265 343,259 343,271" fill="#4A8FBD" /><rect x="360" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="378" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">blocks 0–8</text><text x="378" y="260" font-size="18" fill="#202629" font-weight="normal">原始视觉 token</text><text x="378" y="290" font-size="18" fill="#202629" font-weight="normal">共 320 个位置</text><line x1="624" y1="265" x2="653" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="653,265 643,259 643,271" fill="#4A8FBD" /><rect x="660" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="678" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">blocks 9–11</text><text x="678" y="260" font-size="18" fill="#202629" font-weight="normal">追加 4 registers</text><text x="678" y="290" font-size="18" fill="#202629" font-weight="normal">320 → 324 tokens</text><line x1="924" y1="265" x2="953" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="953,265 943,259 943,271" fill="#4A8FBD" /><rect x="960" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="978" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">移除寄存器</text><text x="978" y="260" font-size="18" fill="#202629" font-weight="normal">LayerNorm 前移除</text><text x="978" y="290" font-size="18" fill="#202629" font-weight="normal">256×768 搜索输出</text><rect x="60" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="78" y="432" font-size="21" fill="#202629" font-weight="bold">共享初值，分别演化</text><text x="78" y="470" font-size="18" fill="#202629" font-weight="normal">RGB / IR 共享 4×768 初始寄存器</text><text x="78" y="501" font-size="18" fill="#202629" font-weight="normal">两路随后各自进行注意力计算</text><text x="78" y="532" font-size="18" fill="#202629" font-weight="normal">新增参数总数为 3,072</text><rect x="650" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="668" y="432" font-size="21" fill="#202629" font-weight="bold">保留空间接口</text><text x="668" y="470" font-size="18" fill="#202629" font-weight="normal">顺序：[template; search; registers]</text><text x="668" y="501" font-size="18" fill="#202629" font-weight="normal">registers 不进入 HMoE 空间分组</text><text x="668" y="532" font-size="18" fill="#202629" font-weight="normal">原 RGB+IR 融合及 CENTER 头保留</text><rect x="60" y="604" width="1160" height="58" rx="9" fill="#EDF5FA" /><text x="78" y="640" font-size="20" fill="#4A8FBD" font-weight="bold">新增 token 参与计算，但不直接作为目标框预测输出</text><text x="60" y="691" font-size="14" fill="#626C70" font-weight="normal">机制示意；实现依据 README_REGISTER_GUIDANCE.md，状态采用注明日期的核验记录。</text></svg>
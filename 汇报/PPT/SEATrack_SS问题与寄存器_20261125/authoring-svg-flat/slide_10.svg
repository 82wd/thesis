<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" lang="zh-CN"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><text x="60" y="55" font-size="16" fill="#4A8FBD" font-weight="normal">想法 4 · 可训练参数与反向传播</text><text x="60" y="105" font-size="31" fill="#202629" font-weight="bold">训练机制：通过跟踪损失学习寄存器</text><rect x="60" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="78" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">前向输入</text><text x="78" y="260" font-size="18" fill="#202629" font-weight="normal">模板与搜索图像</text><text x="78" y="290" font-size="18" fill="#202629" font-weight="normal">训练始终保留寄存器</text><line x1="324" y1="265" x2="353" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="353,265 343,259 343,271" fill="#4A8FBD" /><rect x="360" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="378" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">特征交互</text><text x="378" y="260" font-size="18" fill="#202629" font-weight="normal">Self-attention / AMG</text><text x="378" y="290" font-size="18" fill="#202629" font-weight="normal">MLP 更新全部 token</text><line x1="624" y1="265" x2="653" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="653,265 643,259 643,271" fill="#4A8FBD" /><rect x="660" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="678" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">目标预测</text><text x="678" y="260" font-size="18" fill="#202629" font-weight="normal">搜索特征融合</text><text x="678" y="290" font-size="18" fill="#202629" font-weight="normal">CENTER 原预测头</text><line x1="924" y1="265" x2="953" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="953,265 943,259 943,271" fill="#4A8FBD" /><rect x="960" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="978" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">反向传播</text><text x="978" y="260" font-size="18" fill="#202629" font-weight="normal">2 GIoU + 5 L1</text><text x="978" y="290" font-size="18" fill="#202629" font-weight="normal">+ Focal loss</text><rect x="60" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="78" y="432" font-size="21" fill="#202629" font-weight="bold">更新什么</text><text x="78" y="470" font-size="18" fill="#202629" font-weight="normal">训练 lora / moe / scaling 参数</text><text x="78" y="501" font-size="18" fill="#202629" font-weight="normal">同时更新 register_tokens</text><text x="78" y="532" font-size="18" fill="#202629" font-weight="normal">主干大部分参数和预测头冻结</text><rect x="650" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="668" y="432" font-size="21" fill="#202629" font-weight="bold">怎样验证机制</text><text x="668" y="470" font-size="18" fill="#202629" font-weight="normal">观察 register / patch 范数分布</text><text x="668" y="501" font-size="18" fill="#202629" font-weight="normal">固定样本比较空间特征与平滑度</text><text x="668" y="532" font-size="18" fill="#202629" font-weight="normal">范数变大本身不等于跟踪更准</text><rect x="60" y="604" width="1160" height="58" rx="9" fill="#EDF5FA" /><text x="78" y="640" font-size="20" fill="#4A8FBD" font-weight="bold">当前不做 register dropout；SS 与频域融合均关闭</text><text x="60" y="691" font-size="14" fill="#626C70" font-weight="normal">机制示意；实现依据 README_REGISTER_GUIDANCE.md，状态采用注明日期的核验记录。</text></svg>
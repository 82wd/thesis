<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" lang="zh-CN"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" /><text x="60" y="55" font-size="16" fill="#4A8FBD" font-weight="normal">想法 4 · 相同输入、相同权重，推理时两路对照</text><text x="60" y="105" font-size="31" fill="#202629" font-weight="bold">Register Guidance：外推有寄存器带来的特征变化</text><rect x="60" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="78" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">同一模型</text><text x="78" y="260" font-size="18" fill="#202629" font-weight="normal">有寄存器：F_reg</text><text x="78" y="290" font-size="18" fill="#202629" font-weight="normal">无寄存器：F_no_reg</text><line x1="324" y1="265" x2="353" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="353,265 343,259 343,271" fill="#4A8FBD" /><rect x="360" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="378" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">求特征差</text><text x="378" y="260" font-size="18" fill="#202629" font-weight="normal">ΔF = F_reg</text><text x="378" y="290" font-size="18" fill="#202629" font-weight="normal">       − F_no_reg</text><line x1="624" y1="265" x2="653" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="653,265 643,259 643,271" fill="#4A8FBD" /><rect x="660" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="678" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">指导外推</text><text x="678" y="260" font-size="18" fill="#202629" font-weight="normal">F_RG = F_reg</text><text x="678" y="290" font-size="18" fill="#202629" font-weight="normal">          + w × ΔF</text><line x1="924" y1="265" x2="953" y2="265" stroke="#4A8FBD" stroke-width="2" /><polygon points="953,265 943,259 943,271" fill="#4A8FBD" /><rect x="960" y="180" width="260" height="175" rx="10" fill="#EDF5FA" stroke="#4A8FBD" stroke-width="1.3" /><text x="978" y="218" font-size="23" fill="#4A8FBD" font-weight="bold">一次预测头</text><text x="978" y="260" font-size="18" fill="#202629" font-weight="normal">CENTER → bbox</text><text x="978" y="290" font-size="18" fill="#202629" font-weight="normal">Hann 与原框解码</text><rect x="60" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="78" y="432" font-size="21" fill="#202629" font-weight="bold">推理代价与含义</text><text x="78" y="470" font-size="18" fill="#202629" font-weight="normal">w=0：仅有寄存器的一次前向</text><text x="78" y="501" font-size="18" fill="#202629" font-weight="normal">w&gt;0：骨干两次前向、预测头一次</text><text x="78" y="532" font-size="18" fill="#202629" font-weight="normal">无寄存器分支不是独立训练基线</text><rect x="650" y="398" width="565" height="180" rx="9" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="4,4" /><text x="668" y="432" font-size="21" fill="#202629" font-weight="bold">当前证据与评测</text><text x="668" y="470" font-size="18" fill="#202629" font-weight="normal">已通过本地与 CUDA 小批验证</text><text x="668" y="501" font-size="18" fill="#202629" font-weight="normal">11月25日13:48快照：训练至ep55</text><text x="668" y="532" font-size="18" fill="#202629" font-weight="normal">全量基线 / Register / RG 待比较</text><rect x="60" y="604" width="1160" height="58" rx="9" fill="#EDF5FA" /><text x="78" y="640" font-size="20" fill="#4A8FBD" font-weight="bold">跟踪特征层的 RG 适配；不是对参考论文扩散采样的直接复现</text><text x="60" y="691" font-size="14" fill="#626C70" font-weight="normal">机制示意；实现依据 README_REGISTER_GUIDANCE.md，状态采用注明日期的核验记录。</text></svg>
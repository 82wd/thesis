<g id="title" data-pptx-bounds="60 43 1160 95"><text x="60" y="66" font-size="18" fill="#626C70">下一步 / 用消融回答具体问题</text><text x="60" y="119" font-size="38" fill="#202629">先把影响拆清，再扩大实验</text></g>
<g id="ss-plan" data-pptx-bounds="60 177 550 230"><text x="60" y="211" font-size="28" font-weight="bold" fill="#356E73">SS：是哪一部分约束在起作用？</text><text x="60" y="263" font-size="24" fill="#303638"><tspan x="60" dy="0">先比较 search-only 多层与原版</tspan><tspan x="60" dy="40">再做单层实验，定位有效层与收敛动态</tspan><tspan x="60" dy="40">补齐半权重对照，区分区域与强度影响</tspan></text><text x="60" y="397" font-size="18" fill="#626C70">同时观察跟踪指标；不能只看 SS 损失下降。</text></g>
<g id="frequency-plan" data-pptx-bounds="660 177 560 230"><text x="660" y="211" font-size="28" font-weight="bold" fill="#9A603E">频域：频段选择还是幅值变化？</text><text x="660" y="263" font-size="24" fill="#303638"><tspan x="660" dy="0">同一份无 SS 权重：原相加 vs 等权</tspan><tspan x="660" dy="40">确认轨迹一致，再比较两种频段互换</tspan><tspan x="660" dy="40">单独检查幅值敏感性，统一全量评测</tspan></text><text x="660" y="397" font-size="18" fill="#626C70">历史局部回放与当前模块实验分开报告。</text></g>
<g id="fairness" data-pptx-bounds="60 447 1160 96"><rect x="60" y="447" width="1160" height="96" fill="#F3F4F4" /><text x="82" y="482" font-size="24" font-weight="bold" fill="#202629">比较前统一：初始化、seed、数据、有效 batch、采样量与更新次数</text><text x="82" y="520" font-size="18" fill="#626C70">历史与新实验训练预算需核对；验证集选择配置，测试集按统一协议评估。</text></g>
<g id="closing" data-pptx-bounds="60 574 1160 62"><text x="60" y="612" font-size="28" fill="#202629">阶段目标：先在 LasHeR 找到稳定证据，再扩展 benchmark 或组合模块。</text></g>

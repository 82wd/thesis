<g id="title" data-pptx-bounds="60 40 1160 100"><text x="60" y="66" font-size="18" fill="#356E73">想法 1 / 在原模型上增加训练辅助支路</text><text x="60" y="119" font-size="38" fill="#202629">SS：主干照常前向，入口特征另算关系损失</text></g>

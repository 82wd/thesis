<g id="details" data-pptx-bounds="60 600 1160 61" font-size="18"><text x="60" y="625" fill="#303638">初版：模板／搜索各 0.5；层索引 3 / 5 / 7 / 9 / 11 取均值；矩阵分别为 64×64、256×256。</text><text x="60" y="652" fill="#356E73">无新增参数；损失反传优化上游 PEFT，普通推理跳过 SS。虚线表示训练取特征支路。</text></g>

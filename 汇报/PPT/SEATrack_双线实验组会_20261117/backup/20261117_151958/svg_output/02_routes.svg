<text x="60" y="589" font-size="16" fill="#303638"><tspan x="60" dy="0">两路独立匹配、共享基础权重；HMoE 是跨模态交互支路。</tspan><tspan x="60" dy="26">预测头输出中心分数图、尺寸图和偏移图，再解码为目标框。</tspan><tspan x="60" dy="26" fill="#356E73">SS 约束 block 入口；频段融合替换最后的两路相加。</tspan></text>
</g>
<g id="mechanisms" data-pptx-bounds="665 422 555 238">
<text x="665" y="449" font-size="20" font-weight="bold" fill="#202629">AMG：在 softmax 前互相引导 logits</text>
<text x="665" y="482" font-size="16" fill="#303638"><tspan x="665" dy="0">A′_rgb = A_rgb + w_X × (A_X − A_rgb)；X 路同理</tspan><tspan x="665" dy="25">softmax(A′) × 本路 V；不是跨模态 Q/K 直接交叉注意力。</tspan><tspan x="665" dy="25">w 是可训练标量，不是逐帧由另一个网络预测的权重。</tspan></text>
<text x="665" y="571" font-size="20" font-weight="bold" fill="#202629">HMoE：分层软路由完成全局信息混合</text>
<text x="665" y="601" font-size="16" fill="#303638"><tspan x="665" dy="0">跨模态同类 tokens 拼接 → 子 token 路由 → 低秩专家</tspan><tspan x="665" dy="24">→ token 聚合 → 拆回两路；template / search 分开处理。</tspan><tspan x="665" dy="24">代码：注意力后 4 专家、MLP 后 8 专家，两模块参数独立。</tspan></text>
</g>

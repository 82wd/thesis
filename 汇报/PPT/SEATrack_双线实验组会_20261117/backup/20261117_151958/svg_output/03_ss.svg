<g id="title" data-pptx-bounds="60 40 1160 100"><text x="60" y="66" font-size="16" fill="#356E73">想法 1 / 在原模型上增加训练辅助支路</text><text x="60" y="119" font-size="32" fill="#202629">SS：主干照常前向，入口特征另算关系损失</text></g>
<g id="backbone" data-pptx-bounds="59 169 906 132"><g>
<text x="58.80" y="187.42" font-size="16" fill="#626C70">选定 block 的入口（Q/K/V 与 AMG 之前）</text>
<rect x="58.80" y="203.80" width="202.80" height="96.72" rx="6.24" fill="#F3F4F4" stroke="#356E73" stroke-width="1.56"/><text x="160.20" y="231.88" font-size="20" text-anchor="middle" fill="#356E73">F_rgb / F_x</text><text x="160.20" y="259.96" font-size="16" text-anchor="middle" fill="#303638"><tspan x="160.20" dy="0.00">各自含 template + search</tspan><tspan x="160.20" dy="21.06">从上游编码器取到的特征</tspan></text>
<line x1="263.16" y1="250.60" x2="374.70" y2="250.60" stroke="#626C70" stroke-width="1.56" marker-end="url(#arrow)"/><text x="316.20" y="235.00" font-size="16" text-anchor="middle" fill="#626C70">两路主干</text>
<rect x="378.60" y="203.80" width="304.20" height="96.72" fill="#F3F4F4"/><text x="530.70" y="231.88" font-size="20" text-anchor="middle" fill="#202629">原编码器继续前向</text><text x="530.70" y="259.96" font-size="16" text-anchor="middle" fill="#303638"><tspan x="530.70" dy="0.00">AMG-LoRA / HMoE / MLP</tspan><tspan x="530.70" dy="21.06">SS 不直接输出“修正后的特征”</tspan></text>
<line x1="685.14" y1="250.60" x2="792.00" y2="250.60" stroke="#626C70" stroke-width="1.56" marker-end="url(#arrow)"/><rect x="795.90" y="211.60" width="167.70" height="80.34" fill="#202629"/><text x="879.36" y="240.46" font-size="20" text-anchor="middle" fill="#FFFFFF">相加 + 预测头</text><text x="879.36" y="269.32" font-size="16" text-anchor="middle" fill="#FFFFFF">原跟踪损失 L_tracking</text>
</g></g>
<g id="ss-branch" data-pptx-bounds="59 301 906 202"><g>
<line x1="160.20" y1="302.08" x2="160.20" y2="367.60" stroke="#356E73" stroke-width="1.56" stroke-dasharray="7 5" marker-end="url(#ss-arrow)"/><text x="183.60" y="337.96" font-size="20" fill="#356E73">新增 SS 支路 / 仅训练计算，保留梯度</text>
<rect x="58.80" y="375.40" width="202.80" height="93.60" fill="#F3F4F4" stroke="#356E73"/><text x="160.20" y="400.36" font-size="20" text-anchor="middle" fill="#356E73">区域拆分 + 归一化</text><text x="160.20" y="430.78" font-size="16" text-anchor="middle" fill="#303638"><tspan x="160.20" dy="0.00">template / search 分别计算</tspan><tspan x="160.20" dy="21.06">每个 patch 沿通道归一化</tspan></text>
<line x1="263.94" y1="422.20" x2="304.50" y2="422.20" stroke="#356E73" stroke-width="1.56" marker-end="url(#ss-arrow)"/>
<rect x="312.30" y="382.42" width="68.64" height="68.64" fill="#F3F4F4" stroke="#356E73"/><line x1="334.92" y1="382.42" x2="334.92" y2="451.06" stroke="#D7DDDF"/><line x1="357.54" y1="382.42" x2="357.54" y2="451.06" stroke="#D7DDDF"/><line x1="312.30" y1="405.04" x2="380.94" y2="405.04" stroke="#D7DDDF"/><line x1="312.30" y1="427.66" x2="380.94" y2="427.66" stroke="#D7DDDF"/>
<rect x="405.90" y="382.42" width="68.64" height="68.64" fill="#F3F4F4" stroke="#9A603E"/><line x1="428.52" y1="382.42" x2="428.52" y2="451.06" stroke="#D7DDDF"/><line x1="451.14" y1="382.42" x2="451.14" y2="451.06" stroke="#D7DDDF"/><line x1="405.90" y1="405.04" x2="474.54" y2="405.04" stroke="#D7DDDF"/><line x1="405.90" y1="427.66" x2="474.54" y2="427.66" stroke="#D7DDDF"/>
<text x="346.62" y="473.68" font-size="16" text-anchor="middle" fill="#356E73">S_rgb</text><text x="440.22" y="473.68" font-size="16" text-anchor="middle" fill="#9A603E">S_x</text><text x="312.30" y="495.52" font-size="16" fill="#626C70">S = U × Uᵀ（关系矩阵示意）</text>
<line x1="478.44" y1="422.20" x2="530.70" y2="422.20" stroke="#356E73" stroke-width="1.56" marker-end="url(#ss-arrow)"/><rect x="534.60" y="391.78" width="163.80" height="62.40" fill="#356E73"/><text x="616.50" y="416.74" font-size="20" text-anchor="middle" fill="#FFFFFF">MSE 对齐</text><text x="616.50" y="440.14" font-size="16" text-anchor="middle" fill="#FFFFFF">两模态关系矩阵对齐</text>

</g></g>
<g id="ss-tensors" data-pptx-bounds="1000 165 220 344">
<text x="1000" y="190" font-size="20" font-weight="bold" fill="#356E73">张量与实现细节</text>
<text x="1000" y="225" font-size="16" fill="#303638"><tspan x="1000" dy="0">每路输入 [B,320,768]</tspan><tspan x="1000" dy="29">模板 64 / 搜索 256 tokens</tspan><tspan x="1000" dy="29">模板 SS：[B,64,64]</tspan><tspan x="1000" dy="29">搜索 SS：[B,256,256]</tspan><tspan x="1000" dy="29">含对角线与上下三角</tspan><tspan x="1000" dy="29">不含 template–search pair</tspan><tspan x="1000" dy="29">归一化 eps = 1e−6</tspan><tspan x="1000" dy="29">FP32，特征不 detach</tspan><tspan x="1000" dy="29">推理跳过；不增加参数</tspan></text>
</g>
<g id="ss-objectives" data-pptx-bounds="60 527 570 136">
<text x="60" y="551" font-size="20" font-weight="bold" fill="#202629">损失如何聚合</text>
<text x="60" y="583" font-size="16" fill="#303638"><tspan x="60" dy="0">L_region = 两路 SS 矩阵差的平方均值（batch 与两空间维）</tspan><tspan x="60" dy="24">L_layer = 0.5 × L_template + 0.5 × L_search</tspan><tspan x="60" dy="24">L_ss = 所选层 L_layer 的均值；L_total = L_tracking + 0.1 × L_ss</tspan><tspan x="60" dy="24">L_tracking = 2 × GIoU + 5 × L1 + Focal（默认配置）</tspan></text>
</g>
<g id="ss-training" data-pptx-bounds="665 527 555 136">
<text x="665" y="551" font-size="20" font-weight="bold" fill="#202629">梯度路径与小步验证</text>
<text x="665" y="583" font-size="16" fill="#303638"><tspan x="665" dy="0">L_ss 反传 → 两路上游可训练 PEFT；不改本次前向特征。</tspan><tspan x="665" dy="24">层索引 3 / 5 / 7 / 9 / 11（从 0 开始），先多层、再单层。</tspan><tspan x="665" dy="24">search-only：模板权重 0，搜索仍 0.5，附加系数仍为 0.05。</tspan><tspan x="665" dy="24">前提：direct 布局、无 CLS、CE 保留率 1，空间位置保持对应。</tspan></text>
</g>
<g id="footer" data-pptx-bounds="60 665 1160 30" font-size="16" fill="#626C70"><text x="60" y="686">基于原论文 Fig. 2 改绘；新增部分依据 semantic_alignment.py 与 vit_ci.py。</text><text x="1170" y="686">03</text></g>
</svg>

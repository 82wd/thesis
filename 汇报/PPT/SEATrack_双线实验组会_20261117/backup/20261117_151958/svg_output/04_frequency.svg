<g id="frequency-tensors" data-pptx-bounds="1000 165 220 284">
<text x="1000" y="190" font-size="20" font-weight="bold" fill="#9A603E">默认张量流</text>
<text x="1000" y="225" font-size="16" fill="#303638"><tspan x="1000" dy="0">search：[B,256,768]</tspan><tspan x="1000" dy="28">恢复：[B,768,16,16]</tspan><tspan x="1000" dy="28">rFFT：[B,768,16,9]</tspan><tspan x="1000" dy="28">irFFT → [B,256,768]</tspan><tspan x="1000" dy="28">网格由搜索尺寸／stride推导</tspan><tspan x="1000" dy="28">逐通道 FFT，FP32 计算</tspan><tspan x="1000" dy="28">保留完整幅值与相位</tspan><tspan x="1000" dy="28">输出转回输入 dtype</tspan></text>
</g>
<g id="frequency-equation" data-pptx-bounds="60 469 570 184">
<text x="60" y="495" font-size="20" font-weight="bold" fill="#202629">频域组合与四组对照</text>
<text x="60" y="527" font-size="20" fill="#9A603E">Y = gain × irFFT2(w·A + (1−w)·B)</text>
<text x="60" y="557" font-size="16" fill="#303638"><tspan x="60" dy="0">A / B：RGB / IR 的复数频谱；w 按低／高频取不同权重。</tspan><tspan x="60" dy="23">原始相加：不走频域；等权：w低 = w高 = 0.5，gain = 2。</tspan><tspan x="60" dy="23">RGB低 + IR高：w低 / w高 = 1 / 0；反向组合为 0 / 1。</tspan><tspan x="60" dy="23">等权组直接返回 RGB + IR；两种选频组默认 gain = 2。</tspan></text>
</g>
<g id="frequency-boundaries" data-pptx-bounds="665 469 555 184">
<text x="665" y="495" font-size="20" font-weight="bold" fill="#202629">约束、解释边界与公平性</text>
<text x="665" y="528" font-size="16" fill="#303638"><tspan x="665" dy="0">低频：径向频率 ≤ 0.25 周期／格；高频是其补集。</tspan><tspan x="665" dy="24">图中是中心化掩膜示意，不是真实频谱或 rFFT 半谱布局。</tspan><tspan x="665" dy="24">仅融合 search；关闭 SS；无新增参数，FFT 梯度可回传。</tspan><tspan x="665" dy="24">direct、无 CLS、CE 保留率 1；保留原预测头与框解码。</tspan><tspan x="665" dy="24">同一无 SS 权重评测；gain 不保证 RMS 相同，需幅值对照。</tspan></text>
</g>
<g id="footer" data-pptx-bounds="60 665 1160 30" font-size="16" fill="#626C70"><text x="60" y="686">基于原论文 Fig. 2 改绘；新增模块依据 frequency_fusion.py。保留幅值与相位，梯度可回传。</text><text x="1170" y="686">04</text></g>
</svg>

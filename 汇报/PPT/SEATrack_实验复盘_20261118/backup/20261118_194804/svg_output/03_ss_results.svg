<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 1 / 全量评测</text><text x="60" y="111" font-size="32">SS 没有带来普遍提升：收益依赖数据集</text></g>
<g id="setup" data-pptx-bounds="60 145 1160 65" fill="#303638" font-size="20"><text x="60" y="169"><tspan font-weight="bold">目的：</tspan>检验空间关系对齐能否提升跨模态跟踪。</text><text x="60" y="201"><tspan font-weight="bold">做法：</tspan>原跟踪损失 + 五层双区域 SS；RGB-T / RGB-E / RGB-D 分别训练 60 / 45 / 25 轮。</text></g>
<g id="result-plot" data-pptx-bounds="60 224 760 300"><image href="../images/ss_results.png" x="60" y="224" width="760" height="285" preserveAspectRatio="xMidYMid meet"/></g>
<g id="results" data-pptx-bounds="845 233 375 283" fill="#303638" font-size="20"><text x="845" y="258" font-weight="bold">基线 → 初版 SS</text><text x="845" y="302">LasHeR：57.51 → 56.71</text><text x="845" y="341">RGBT234：63.73 → 64.67</text><text x="845" y="380">VisEvent：60.26 → 59.63</text><text x="845" y="419">DepthTrack：63.23 → 60.97</text><text x="845" y="466" font-size="16">VOT2022-RGBD EAO（独立量纲）</text><text x="845" y="498">0.73760 → 0.72659</text></g>
<g id="inference" data-pptx-bounds="60 540 1160 109" fill="#303638"><rect x="60" y="540" width="1160" height="109" fill="#F3F4F4"/><text x="80" y="568" font-size="20" font-weight="bold">下一步问题：是普遍小幅退化，还是少数失败序列持续跟偏？</text><text x="80" y="601" font-size="16">序列配对重采样 95% 区间（百分点）：LasHeR [−1.93, +0.18]；RGBT234 [+0.37, +1.58]；VisEvent [−1.37, +0.04]。</text><text x="80" y="630" font-size="16">区间只反映测试序列组成，不覆盖训练随机性；RGB-D / RGB-E 对照为历史基线，复现一致性仍有局限。</text></g>

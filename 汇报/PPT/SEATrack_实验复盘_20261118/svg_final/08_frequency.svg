<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#202629"/></marker></defs><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 2 / 固定特征频段互换：原理与取样</text><text x="60" y="111" font-size="32">在频域拆分两模态，再把互补频段送回原预测头</text></g>
<g id="purpose" data-pptx-bounds="60 145 1160 60" fill="#303638" font-size="20"><text x="60" y="168"><tspan font-weight="bold">目的：</tspan>检验“RGB 低频 + 红外高频”是否更有利，同时测试相反组合与幅值因素。</text><text x="60" y="200" font-size="16">干预位置：原编码器末层 search 特征，保留原 AMG / HMoE；不重训模型，不依赖失败帧标签触发。</text></g>
<g id="frequency-flow" data-pptx-bounds="60 224 1160 233" fill="#202629">
<rect x="60" y="235" width="230" height="70" fill="#F3F4F4"/><text x="78" y="262" font-size="20">RGB 搜索特征</text><text x="78" y="289" font-size="16">[B,256,768] → 16 × 16</text>
<rect x="60" y="343" width="230" height="70" fill="#F3F4F4"/><text x="78" y="370" font-size="20">红外搜索特征</text><text x="78" y="397" font-size="16">每个通道分别变换</text>
<line x1="290" y1="270" x2="330" y2="270" stroke="#202629" marker-end="url(#a)"/><line x1="290" y1="378" x2="330" y2="378" stroke="#202629" marker-end="url(#a)"/>
<rect x="340" y="235" width="170" height="70" fill="#F3F4F4"/><text x="360" y="262" font-size="20">rFFT2</text><text x="360" y="289" font-size="16">完整复数频谱</text><rect x="340" y="343" width="170" height="70" fill="#F3F4F4"/><text x="360" y="370" font-size="20">rFFT2</text><text x="360" y="397" font-size="16">幅值 + 相位保留</text>
<line x1="510" y1="270" x2="550" y2="270" stroke="#202629" marker-end="url(#a)"/><line x1="510" y1="378" x2="550" y2="378" stroke="#202629" marker-end="url(#a)"/>
<rect x="560" y="235" width="345" height="178" fill="#F3F4F4" stroke="#9A603E"/><text x="580" y="264" font-size="20" font-weight="bold">径向硬掩膜 M：截止 0.25</text><text x="580" y="300" font-size="16">方案 R-low：M·F_RGB + (1−M)·F_IR</text><text x="580" y="334" font-size="16">方案 I-low：M·F_IR + (1−M)·F_RGB</text><text x="580" y="371" font-size="16">另设原相加与两种 RMS 匹配对照</text><text x="580" y="398" font-size="16">低频在中心，高频为补集</text>
<line x1="905" y1="324" x2="945" y2="324" stroke="#202629" marker-end="url(#a)"/>
<rect x="955" y="235" width="265" height="178" fill="#F3F4F4"/><text x="975" y="267" font-size="20">irFFT2 → 空域特征</text><text x="975" y="305" font-size="16">可选：匹配原融合特征 RMS</text><text x="975" y="343" font-size="20">原预测头 + Hann 解码</text><text x="975" y="382" font-size="16">比较框 IoU 与响应峰</text><text x="60" y="450" font-size="16">所有方案固定同一模板、当前帧和存档 SS 前框；基线与初版 SS 两份权重均测试，规则对失败窗和稳定窗一视同仁。</text></g>
<g id="sampling" data-pptx-bounds="60 479 1160 171" fill="#303638" font-size="16"><text x="60" y="502" font-size="20" font-weight="bold">取样不是随机抽样，而是“失败案例 + 严格稳定对照”的观察实验</text><text x="60" y="538">失败窗：whitesuvturn 18–28 帧、1blackteacher 160–170 帧；关键失败帧各前后 5 帧，共 22 帧。</text><text x="60" y="570">稳定窗：两版原模型在 45–55 帧均满足每帧 IoU ≥ 0.65，按序列名排序取前 6 条，共 66 帧。</text><text x="60" y="602">总计 8 段、88 帧 × 2 份权重 × 5 个方案 = 880 次预测；RMS 对照用于检查增益是否仅来自幅值变化。</text><text x="60" y="634" font-weight="bold">边界：每帧独立回放，不让融合结果决定下一帧搜索框；不能据此估计闭环或全量性能。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">截止频率单位：周期/空间网格。此页对应已完成的历史特征层诊断，不与后续独立无 SS 模块混算。</text><text x="1170" y="687">08</text></g></svg>

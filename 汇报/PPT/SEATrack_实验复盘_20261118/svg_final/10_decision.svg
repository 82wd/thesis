<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#202629"/></marker></defs><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 2 / 从固定特征互换，到可学习决策图融合</text><text x="60" y="111" font-size="32">冻结模型，只学习低频与高频两个全局权重</text></g>
<g id="purpose" data-pptx-bounds="60 145 1160 65" fill="#303638" font-size="20"><text x="60" y="168"><tspan font-weight="bold">目的：</tspan>固定二选一过于刚性，能否让训练数据决定各频段的模态占比？</text><text x="60" y="201" font-size="16">频域操作改到中心分类得分图，而不是沿用上一实验的 768 通道特征；两组实验不能当作同一模块的连续收益。</text></g>
<g id="decision-flow" data-pptx-bounds="60 231 1160 218" fill="#202629">
<rect x="60" y="241" width="235" height="70" fill="#F3F4F4"/><text x="78" y="268" font-size="20">RGB 末层 search</text><text x="78" y="295" font-size="16">冻结初版 SS ep60</text><rect x="60" y="347" width="235" height="70" fill="#F3F4F4"/><text x="78" y="374" font-size="20">红外末层 search</text><text x="78" y="401" font-size="16">冻结初版 SS ep60</text>
<line x1="295" y1="276" x2="335" y2="276" stroke="#202629" marker-end="url(#a)"/><line x1="295" y1="382" x2="335" y2="382" stroke="#202629" marker-end="url(#a)"/>
<rect x="345" y="241" width="230" height="70" fill="#F3F4F4"/><text x="363" y="268" font-size="20">同一个中心分类头</text><text x="363" y="295" font-size="16">sigmoid 前 logits → FFT</text><rect x="345" y="347" width="230" height="70" fill="#F3F4F4"/><text x="363" y="374" font-size="20">同一个中心分类头</text><text x="363" y="401" font-size="16">sigmoid 前 logits → FFT</text>
<line x1="575" y1="276" x2="615" y2="276" stroke="#202629" marker-end="url(#a)"/><line x1="575" y1="382" x2="615" y2="382" stroke="#202629" marker-end="url(#a)"/>
<rect x="625" y="241" width="310" height="176" fill="#F3F4F4" stroke="#9A603E"/><text x="643" y="270" font-size="20" font-weight="bold">分段加权复数频谱</text><text x="643" y="304" font-size="16">低频：w_low，RGB 权重</text><text x="643" y="335" font-size="16">高频：w_high，RGB 权重</text><text x="643" y="366" font-size="16">红外权重均为 1 − w</text><text x="643" y="398" font-size="16">全局 2 参数；截止仍为 0.25</text>
<line x1="935" y1="329" x2="975" y2="329" stroke="#202629" marker-end="url(#a)"/>
<rect x="985" y="241" width="235" height="176" fill="#F3F4F4"/><text x="1003" y="276" font-size="20">逆 FFT → 中心图</text><text x="1003" y="315" font-size="16">位置分类 CE 拟合权重</text><text x="1003" y="354" font-size="16">尺寸／偏移保持原版</text><text x="1003" y="393" font-size="16">Hann 与框解码沿用原版</text></g>
<g id="fit" data-pptx-bounds="60 473 1160 179" fill="#303638"><text x="60" y="498" font-size="20" font-weight="bold">训练与验证：学习频段偏好，不新增逐帧自适应网络</text><text x="60" y="535" font-size="20">训练 48 条序列 / 384 帧，Adam 更新 150 次；验证另 16 条 / 128 帧。</text><text x="60" y="569" font-size="16">训练与验证序列分离，均排除 LasHeR 测试名单；梯度有限且非零，FFT / 逆 FFT 的梯度可以回传。</text><text x="60" y="605" font-size="20" fill="#9A603E">学得 RGB 权重：低频 0.97319；高频 0.26820。</text><text x="60" y="639" font-size="16">说明拟合样本更偏好 RGB 低频、红外高频；这只是两参数拟合的结果，仍需闭环跟踪检验。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">原理图依据实际决策图融合实现；不将全局频段权重描述成逐帧门控。</text><text x="1170" y="687">10</text></g></svg>

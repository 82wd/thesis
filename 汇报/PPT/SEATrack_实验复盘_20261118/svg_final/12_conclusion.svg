<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="ending"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">结论 / 已有证据与下一步</text><text x="60" y="111" font-size="32">先证明可复现的跟踪收益，再扩大或组合方法</text></g>
<g id="ss-summary" data-pptx-bounds="60 150 1160 135" fill="#303638"><text x="60" y="178" font-size="24" fill="#356E73" font-weight="bold">想法 1 · SS</text><text x="315" y="178" font-size="20" font-weight="bold">实现了关系约束，但没有获得普遍增益。</text><text x="315" y="212" font-size="16">已做：五层 pairwise SS、三类模态训练、五数据集结果与逐序列失败分析。</text><text x="315" y="242" font-size="16">证据：RGBT234 改善，LasHeR / VisEvent / RGB-D 退化；关系损失下降不能直接说明跟踪更好。</text><text x="315" y="272" font-size="16">当前为 patch–patch 关系矩阵；师兄提出的平均池化／可学习 query 语义 anchor 版本尚未实现。</text></g>
<line id="divider-1" data-pptx-role="decoration" x1="60" y1="300" x2="1220" y2="300" stroke="#D7DDDF"/>
<g id="remedy-summary" data-pptx-bounds="60 319 1160 138" fill="#303638"><text x="60" y="347" font-size="24" fill="#356E73" font-weight="bold">想法 3 · 补救</text><text x="315" y="347" font-size="20" font-weight="bold">A/B 部分恢复；search-only 收敛，跟踪效果待测。</text><text x="315" y="381" font-size="16">已做：搜索框交换、A/B 重训与全量测评、search-only 60 轮及训练动态。</text><text x="315" y="411" font-size="16">优先：search-only 全量测评；核验半权重末轮，匹配更新次数，再做单层消融。</text><text x="315" y="441" font-size="16">补记录：同一可训练参数上的 tracking / SS 梯度范数与夹角，判断尺度及优化冲突。</text></g>
<line id="divider-2" data-pptx-role="decoration" x1="60" y1="473" x2="1220" y2="473" stroke="#D7DDDF"/>
<g id="frequency-summary" data-pptx-bounds="60 492 1160 138" fill="#303638"><text x="60" y="520" font-size="24" fill="#9A603E" font-weight="bold">想法 2 · 频段</text><text x="315" y="520" font-size="20" font-weight="bold">存在局部互补，但固定分工不稳，闭环收益尚未建立。</text><text x="315" y="554" font-size="16">已做：固定特征互换 + RMS 对照、两参数决策图拟合、两条序列闭环。</text><text x="315" y="584" font-size="16">优先：同一无 SS 权重下核验“原相加 = 等权”轨迹，再比较两方向频段并完成全量测评。</text><text x="315" y="614" font-size="16">先在一个 benchmark 上筛选有效设置，再扩展数据集；不以挑选的失败帧决定方法有效性。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">目前可以说“找到了退化现象和部分边界”，还不能说“SS 补救或频段融合已解决问题”。</text><text x="1170" y="687">12</text></g></svg>

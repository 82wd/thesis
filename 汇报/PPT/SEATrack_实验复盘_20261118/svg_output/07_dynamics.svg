<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 3 / Search-only：2026.11.18 核验 60/60 轮完成，测试尚未出分</text><text x="60" y="111" font-size="32">SS 关系损失在下降，验证 IoU 已进入平台期</text></g>
<g id="setup" data-pptx-bounds="60 145 1160 66" fill="#303638" font-size="20"><text x="60" y="168"><tspan font-weight="bold">目的：</tspan>验证“只约束搜索区域”，并记录 SS 训练动态。</text><text x="60" y="201"><tspan font-weight="bold">做法：</tspan>去掉模板 SS；五个 block 入口取搜索关系 MSE，附加损失为 0.05 × 层平均。</text></g>
<g id="result-plot" data-pptx-bounds="60 219 1160 350"><image href="../images/dynamics.png" x="60" y="219" width="1160" height="350" preserveAspectRatio="xMidYMid meet"/></g>
<g id="observations" data-pptx-bounds="60 575 1160 81" fill="#303638" font-size="16"><text x="60" y="594"><tspan font-weight="bold">效果：</tspan>训练搜索 SS：0.02681 → 0.01990；验证：0.02342（ep5）→ 0.01827（ep60）；末轮验证 IoU 0.74854。</text><text x="60" y="621"><tspan font-weight="bold">尺度：</tspan>末轮加权 SS 约占总损失 0.10%（训练）/ 0.08%（验证）；数值占比小不代表梯度影响小，尚无梯度范数与夹角。</text><text x="60" y="648"><tspan font-weight="bold">可比性：</tspan>本次 1,875 次更新/轮，A/B 为 937 次；须匹配预算。训练完成不等于 LasHeR / RGBT234 跟踪性能提升。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">全部 60 个训练点、12 个验证点；epoch 样本加权均值，无平滑。裁剪样本 IoU ≠ 完整序列 SR。</text><text x="1170" y="687">07</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 2 / 固定融合结果：初版 SS 权重，所有方案使用同一搜索前框</text><text x="60" y="111" font-size="32">白车可以救回；人脸未恢复，稳定片段反而退化</text></g>
<g id="legend-note" data-pptx-bounds="60 145 1160 56" fill="#303638" font-size="16"><text x="60" y="168">Sum = 原相加；R-low = RGB 低频 + 红外高频；I-low = 红外低频 + RGB 高频；RMS = 匹配原融合特征幅值。</text><text x="60" y="196">三个面板分别检验：失败帧能否救回、能否迁移到另一类失败、是否损伤原本稳定的跟踪。</text></g>
<g id="result-plot" data-pptx-bounds="60 215 1160 350"><image href="../images/frequency_results.png" x="60" y="215" width="1160" height="350" preserveAspectRatio="xMidYMid meet"/></g>
<g id="effect" data-pptx-bounds="60 568 1160 86" fill="#303638" font-size="16"><text x="60" y="590"><tspan font-weight="bold">局部效果：</tspan>I-low 白车关键帧 0 → 0.811，RMS 后 0.825；11 帧白车均值 0.410 → 0.471，RMS 后 0.475。</text><text x="60" y="619"><tspan font-weight="bold">反例：</tspan>I-low 人脸 11 帧均值 0.376 → 0.325；稳定 66 帧 0.802 → 0.771（RMS 后 0.778），仍低于原相加。</text><text x="60" y="648"><tspan font-weight="bold">基线权重也有类似局限：</tspan>I-low 白车关键帧 0 → 0.806，但稳定均值 0.802 → 0.754；不支持固定模态频段分工。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">均为 IoU；单个失败关键帧与稳定窗口均值的样本量不同，不作总体平均或显著性比较。</text><text x="1170" y="687">09</text></g></svg>

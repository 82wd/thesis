<text x="643" y="326" font-size="16">模板 SS 保留；GT 仅训练时用于辅助项，不增加预测网络。</text><text x="460" y="354" font-size="16">示意中按 FG/BG 分块便于理解；实际用连续覆盖率构造位置对权重。</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 3 / Template-only 与 Target-aware：已完成重训及全量评测</text><text x="60" y="111" font-size="32">A/B 恢复部分 LasHeR 性能，但仍略低于基线</text></g>
<g id="protocol" data-pptx-bounds="60 145 1160 65" fill="#303638" font-size="16"><text x="60" y="169"><tspan font-weight="bold">做法：</tspan>同一 OSTrack 初始化、seed 0；60 轮 FP32；AdamW，lr 0.0004，第 48 轮衰减；有效批量 64，每轮 937 次更新。</text><text x="60" y="199"><tspan font-weight="bold">评测：</tspan>LasHeR 245 条 / 220,703 帧；RGBT234 234 条 / 116,649 帧；名单、帧数与标注指纹一致。</text></g>
<g id="result-plot" data-pptx-bounds="60 220 1160 286"><image href="../images/ab_results.png" x="60" y="220" width="760" height="285" preserveAspectRatio="xMidYMid meet"/>
<text x="850" y="250" font-size="20" font-weight="bold" fill="#4A8FBD">LasHeR：相对初版恢复</text><text x="850" y="282" font-size="20" fill="#303638">A +0.60 pp；B +0.58 pp</text><text x="850" y="315" font-size="16" fill="#626C70">相对基线：−0.20 / −0.22 pp</text><text x="850" y="374" font-size="20" font-weight="bold" fill="#BC8E53">RGBT234：初版收益缩水</text><text x="850" y="407" font-size="20" fill="#303638">A −0.64 pp；B −0.61 pp</text><text x="850" y="440" font-size="16" fill="#626C70">相对基线仍为 +0.29 / +0.32 pp</text><text x="850" y="481" font-size="16" fill="#626C70">虚线为基线；点图使用局部数值范围。</text></g>
<g id="effects" data-pptx-bounds="60 530 1160 125" fill="#303638" font-size="16"><line x1="60" y1="530" x2="1220" y2="530" stroke="#B9D4E5"/><text x="60" y="558"><tspan font-weight="bold">逐序列：</tspan>LasHeR 相对初版 SS，A 为 119 升 / 125 降 / 1 平；B 为 123 升 / 118 降 / 4 平，改善数量没有明显占优。</text><text x="60" y="588"><tspan font-weight="bold">失败案例：</tspan>白车三组均在第 23 帧持续跟偏且未恢复；人群 A 未触发既定跟偏标准，B 在第 164 帧触发、未恢复。</text><text x="60" y="618"><tspan font-weight="bold">结论：</tspan>A/B 只能称为部分恢复；B 不优于 A，尚不能确认“背景–背景关系”就是退化原因。</text><text x="60" y="646">A 未触发阈值不等于始终准确；以上为单次训练结果，没有跨 seed 稳定性结论。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">指标为 %；pp 为百分点。A = Template-only；B = Target-aware。完整五指标列于讲稿备注。</text><text x="1170" y="687">06</text></g></svg>

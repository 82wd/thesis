<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">想法 2 / 决策图融合：拟合效果与两条序列闭环</text><text x="60" y="111" font-size="32">验证 CE 降了，但单帧修复没有转化为整段收益</text></g>
<g id="ce-table" data-pptx-bounds="60 145 530 266" fill="#303638" font-size="20"><text x="60" y="170" font-weight="bold">a  分类拟合：CE 越低越好</text><rect x="60" y="193" width="530" height="38" fill="#EDF5FA"/><text x="75" y="220" font-size="16">方案</text><text x="340" y="220" font-size="16">训练</text><text x="465" y="220" font-size="16">验证</text><text x="75" y="267">等权</text><text x="340" y="267">2.93525</text><text x="465" y="267">2.72052</text><text x="75" y="310">RGB 低 + 红外高</text><text x="340" y="310">2.86395</text><text x="465" y="310">2.73506</text><text x="75" y="353">红外低 + RGB 高</text><text x="340" y="353">3.13950</text><text x="465" y="353">2.81659</text><text x="75" y="396" fill="#BC8E53" font-weight="bold">学习融合</text><text x="340" y="396" fill="#BC8E53">2.85214</text><text x="465" y="396" fill="#BC8E53">2.69162</text></g>
<g id="closed-loop" data-pptx-bounds="640 145 580 266" fill="#303638"><text x="640" y="170" font-size="20" font-weight="bold">b  闭环验证：每步使用自身上一帧预测框</text><text x="640" y="217" font-size="20">whitesuvturn · 137 帧</text><text x="640" y="250" font-size="16">关键帧 IoU：0 → 0.86151</text><text x="640" y="282" font-size="20" fill="#BC8E53">整段 SR：15.5718% → 15.5718%</text><text x="640" y="329" font-size="20">1blackteacher · 851 帧</text><text x="640" y="362" font-size="16">关键帧 IoU：0.01379 → 0.01518</text><text x="640" y="394" font-size="20">整段 SR：16.0539% → 16.0651%</text></g>
<g id="interpretation" data-pptx-bounds="60 442 1160 100" fill="#303638"><rect x="60" y="442" width="1160" height="100" fill="#EDF5FA"/><text x="80" y="475" font-size="20" font-weight="bold">效果：拟合目标改善，局部响应有变化；目前没有可报告的整体跟踪增益。</text><text x="80" y="508" font-size="16">白车关键帧救回但 SR 完全相同，说明后续轨迹仍有失败；两条案例不能代替全量评测，也不能据此解释全部失败机制。</text><text x="80" y="533" font-size="16">闭环比较为初版 SS 原预测 → 学习决策图融合；不同于上一页固定前框的单帧回放。</text></g>
<g id="current-module" data-pptx-bounds="60 564 1160 87" fill="#303638" font-size="16"><text x="60" y="585" font-size="20" font-weight="bold">独立无 SS 频段模块：实现已具备，结果仍待补齐</text><text x="60" y="617">已实现关闭融合／等权／RGB 低／红外低四配置；等权直接返回原相加，固定融合逆变换使用 gain = 2。</text><text x="60" y="646">15 项 CPU 检查通过；真实权重轨迹一致性、CUDA 与全量 benchmark 尚未核验，不与上面历史诊断数字混用。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">来源：两参数拟合记录与闭环 pilot。频域全量正式报告尚无已核验结果。</text><text x="1170" y="687">11</text></g></svg>

<g id="objective" data-pptx-bounds="60 579 1160 74" fill="#202629"><rect x="60" y="579" width="1160" height="74" rx="10" fill="#EDF5FA"/><text x="80" y="610" font-size="24" font-weight="bold">L_total = L_tracking + 0.1 L_SS</text><text x="675" y="609" font-size="16">不增加参数；反传更新上游 PEFT；推理跳过 SS。</text><text x="80" y="639" font-size="16">L_tracking = 2 GIoU + 5 L1 + Focal；FP32、eps = 1e−6、不 detach；矩阵包含对角和双向位置对。</text></g>

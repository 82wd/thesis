<svg xmlns="http://www.w3.org/2000/svg" width="1280px" height="720px" viewBox="0 0 1280 720" font-family="Arial, PingFang SC, sans-serif" data-pptx-page-role="content"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#202629"/></marker></defs><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="title" data-pptx-bounds="60 38 1160 90" fill="#202629"><text x="60" y="62" font-size="16">诊断 / 为什么退化，为补救找依据</text><text x="60" y="111" font-size="32">搜索框交换：前序偏移与框内目标选择都有影响</text></g>
<g id="failures" data-pptx-bounds="60 145 1160 83" fill="#303638" font-size="16"><text x="60" y="166"><tspan font-weight="bold">逐序列：</tspan>LasHeR 122 升／122 降／1 平，最差两条贡献约 −0.55 pp；VisEvent 最差五条贡献 −0.617 / 净 −0.635 pp。</text><text x="60" y="194">白车从第 23 帧、人群从第 165 帧持续跟偏；足球连续 510 帧 IoU &lt; 0.2，girl1 从第 60 帧至结尾连续 122 帧低于阈值。</text><text x="60" y="222"><tspan font-weight="bold">目的：</tspan>区分“上一帧定位偏移导致裁剪错误”和“在相同搜索区域内选错目标”。</text></g>
<g id="swap-flow" data-pptx-bounds="60 246 1160 135" fill="#202629">
<rect x="60" y="247" width="240" height="112" fill="#EDF5FA"/><text x="80" y="279" font-size="20" font-weight="bold">固定输入</text><text x="80" y="309" font-size="16">首帧模板 + 当前帧</text><text x="80" y="338" font-size="16">5 条失败序列，逐帧独立</text>
<line x1="300" y1="303" x2="340" y2="303" stroke="#202629" marker-end="url(#a)"/>
<rect x="350" y="247" width="300" height="112" fill="#EDF5FA" stroke="#4A8FBD"/><text x="370" y="279" font-size="20" font-weight="bold">替换前一帧搜索框</text><text x="370" y="309" font-size="16">基线前框／SS 前框／GT 前框</text><text x="370" y="338" font-size="16">控制搜索区域，GT 只作诊断</text>
<line x1="650" y1="303" x2="690" y2="303" stroke="#202629" marker-end="url(#a)"/>
<rect x="700" y="247" width="240" height="112" fill="#EDF5FA"/><text x="720" y="279" font-size="20" font-weight="bold">两份固定权重</text><text x="720" y="309" font-size="16">基线／初版 SS</text><text x="720" y="338" font-size="16">形成 2 × 3 组配对</text>
<line x1="940" y1="303" x2="980" y2="303" stroke="#202629" marker-end="url(#a)"/>
<rect x="990" y="247" width="230" height="112" fill="#EDF5FA"/><text x="1010" y="279" font-size="20" font-weight="bold">对比预测 IoU</text><text x="1010" y="309" font-size="16">起点 −10 至 +15 帧</text><text x="1010" y="338" font-size="16">无效标注跳过</text></g>
<g id="cases" data-pptx-bounds="60 394 1160 161" fill="#303638" font-size="20"><text x="60" y="420" font-weight="bold">白车第 23 帧：只换前框，即可改变成败</text><text x="60" y="455">SS：自己的前框 0 → 基线前框 0.862</text><text x="60" y="489">基线：自己的前框 0.851 → SS 前框 0</text><text x="60" y="530" font-size="16">起点后 16 帧平均：SS 用基线前框 0.831，用 SS 前框 0.009。</text><line x1="645" y1="399" x2="645" y2="547" stroke="#B9D4E5"/><text x="680" y="420" font-weight="bold">相同前框下，SS 仍可能选错目标</text><text x="680" y="455">人群第 165 帧（同用 SS 前框）</text><text x="680" y="489">基线 0.746；SS 0.014</text><text x="680" y="530" font-size="16">足球第 63 帧（同用基线前框）：基线 0.818；SS 0.031。</text></g>
<g id="boundary" data-pptx-bounds="60 575 1160 77" fill="#303638"><text x="60" y="600" font-size="20" font-weight="bold">效果：支持“关键帧选错 → 搜索区偏移 → 后续持续失败”的过程解释。</text><text x="60" y="635" font-size="16">这是非闭环诊断，不是补救算法，也不能单独证明 SS 损失导致退化；0/10/20/30% 人工偏移实验尚未执行。</text></g>
<g id="footer" data-pptx-bounds="60 668 1160 26" fill="#626C70" font-size="16"><text x="60" y="687">持续跟偏：连续 5 帧基线 IoU ≥ 0.5 且 SS &lt; 0.2；自前框回放坐标误差 &lt; 10⁻⁶ px。</text><text x="1170" y="687">04</text></g></svg>

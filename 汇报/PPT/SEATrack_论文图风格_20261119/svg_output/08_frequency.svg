<g id="mask-detail" data-pptx-bounds="60 411 370 216" fill="#202629"><rect x="60" y="411" width="370" height="216" rx="12" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="5 4"/><text x="78" y="442" font-size="20" font-weight="bold">b  掩膜定义与对照</text><text x="78" y="478" font-size="16">M = 1：径向频率 ≤ 0.25 周期/格</text><text x="78" y="507" font-size="16">保留完整复数系数，不只混合幅值。</text><text x="78" y="543" font-size="16">原相加 / 两个互换方向</text><text x="78" y="572" font-size="16">+ 两个方向的 RMS 匹配版 = 5 组</text><text x="78" y="608" font-size="16">RMS：排除仅靠幅值变化的解释。</text></g>
<g id="sample-detail" data-pptx-bounds="450 411 370 216" fill="#202629"><rect x="450" y="411" width="370" height="216" rx="12" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="5 4"/><text x="468" y="442" font-size="20" font-weight="bold">c  失败窗 + 稳定对照</text><text x="468" y="478" font-size="16">白车 18–28；人群 160–170 帧</text><text x="468" y="507" font-size="16">关键失败帧各 ±5，共 22 帧。</text><text x="468" y="543" font-size="16">稳定：两原模型 45–55 帧 IoU 均 ≥0.65</text><text x="468" y="572" font-size="16">按序列名取前 6 条，共 66 帧。</text><text x="468" y="608" font-size="16">8 段，共 88 帧 × 2 权重 × 5 方案</text></g>
<g id="replay-detail" data-pptx-bounds="840 411 380 216" fill="#202629"><rect x="840" y="411" width="380" height="216" rx="12" fill="#FFFFFF" stroke="#B9D4E5" stroke-dasharray="5 4"/><text x="858" y="442" font-size="20" font-weight="bold">d  固定前框，逐帧独立回放</text><text x="858" y="478" font-size="16">固定模板、当前帧与存档 SS 前框。</text><text x="858" y="507" font-size="16">基线和初版 SS 两份权重都测试。</text><text x="858" y="543" font-size="16">同一规则用于失败窗和稳定窗；</text><text x="858" y="572" font-size="16">不根据“是否失败”决定如何融合。</text><text x="858" y="608" font-size="16" font-weight="bold">共 880 次预测；不是闭环／全量结果。</text></g>
<g id="footer" data-pptx-bounds="60 651 1160 43" fill="#626C70" font-size="16"><text x="60" y="665">圆形为中心化频域的掩膜示意，非实测频谱；实现为 rFFT 紧凑存储。RGB / IR 色彩仅表示来源。</text><text x="60" y="687">此页为已完成的历史特征层诊断；后续独立无 SS 模块另行验证。</text><text x="1170" y="687">08</text></g></svg>
